version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-tools:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript below 6.1. Remove this once it supports 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Node.js types follow the oldest Node.js version in use, not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  # Image digests in the Compose files: the development stack and the example deployment.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy
    schedule:
      interval: weekly
    ignore:
      # A new major version of PostgreSQL cannot open an older data directory. Moving to one is
      # a planned migration with a dump and a restore, not a digest bump. Minor and patch
      # releases, and new digests of the same version, still arrive here.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
