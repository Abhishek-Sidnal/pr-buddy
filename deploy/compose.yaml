# An example production stack: Caddy (HTTPS), the PR Buddy API with its dashboard, PostgreSQL.
# Only Caddy is reachable from outside. Guide: docs/DEPLOYMENT.md
#
#   cp deploy/.env.example deploy/.env    # then fill it in
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
# A name of its own, so it never shares containers or volumes with the development stack.
name: prbuddy-deploy

services:
  proxy:
    image: caddy:2-alpine
    environment:
      # The name people type. Caddy obtains a certificate for it by itself; for "localhost" it
      # issues one from a local authority.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and their keys. Losing this volume means asking for certificates again.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    cap_drop:
      - ALL
    cap_add:
      # To listen on ports 80 and 443.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgres://prbuddy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/prbuddy
      # Exactly one proxy, Caddy, is in front. Raise it if a load balancer sits in front of Caddy.
      TRUST_PROXY: "1"
    # No published port: the API is reached through the proxy only.
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prbuddy
      # There is no default: the stack refuses to start without a password of your own.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: prbuddy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username prbuddy --dbname prbuddy"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
